services:
  frontend:
    container_name: crypto-wallet-web
    build:
      context: ../frontend-angular
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER}/crypto-portfolio-frontend:latest
    restart: unless-stopped
    environment:
      PORT: 4200
      CRYPTO_APP_API_BASE_URL: http://apache/api/v1
      CRYPTO_APP_PUBLIC_API_BASE_URL: /api/v1
      CRYPTO_APP_PROXY_TARGET: http://apache
      NG_ALLOWED_HOSTS: 127.0.0.1,localhost

    ports:
      - "4200:4200"
    depends_on:
      apache:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
  node_api_base:
    container_name: crypto-wallet-node
    build:
      context: ../node_api_base
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER}/crypto-portfolio-node:latest
    restart: unless-stopped
    env_file:
      - ../node_api_base/.env
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ../node_api_base/keystore:/app/keystore:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    container_name: crypto-wallet-backend
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER}/crypto-portfolio-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: crypto_portfolio
      DB_USERNAME: "db_user"
      DB_PASSWORD: "db_password"
      MAIL_MAILER: "smtp"
      MAIL_SCHEME: "null"
      MAIL_HOST: "sandbox.smtp.mailtrap.io"
      MAIL_PORT: 2525
      MAIL_USERNAME: "3950caf3c44c28"
      MAIL_PASSWORD: "932fd4fa5b97fb"
      MAIL_FROM_ADDRESS: "noreply@cryptovault.local"
      MAIL_FROM_NAME: "${APP_NAME}"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:4200,http://127.0.0.1:4200,http://localhost:8000,http://127.0.0.1:8000
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:4200,localhost:4200,localhost:8000,127.0.0.1,127.0.0.1:4200,127.0.0.1:4200,127.0.0.1:8000
      BLOCKCHAIN_SERVICE_URL: http://node_api_base:5000
      BLOCKCHAIN_SERVICE_SECRET: ${BLOCKCHAIN_SERVICE_SECRET}
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      node_api_base:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t && php artisan route:list > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3

  queue-worker:
    container_name: crypto-wallet-queue
    image: ghcr.io/${GHCR_OWNER}/crypto-portfolio-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: crypto_portfolio
      DB_USERNAME: "db_user"
      DB_PASSWORD: "db_password"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:4000,http://127.0.0.1:4000,http://localhost:8000,http://127.0.0.1:8000
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:4200,localhost:4000,localhost:8000,127.0.0.1,127.0.0.1:4200,127.0.0.1:4000,127.0.0.1:8000
      MAIL_MAILER: "smtp"
      MAIL_SCHEME: "null"
      MAIL_HOST: "sandbox.smtp.mailtrap.io"
      MAIL_PORT: 2525
      MAIL_USERNAME: "3950caf3c44c28"
      MAIL_PASSWORD: "932fd4fa5b97fb"
      MAIL_FROM_ADDRESS: "noreply@cryptovault.local"
      MAIL_FROM_NAME: "${APP_NAME}"
      BLOCKCHAIN_SERVICE_URL: http://node_api_base:5000
      BLOCKCHAIN_SERVICE_SECRET: ${BLOCKCHAIN_SERVICE_SECRET}
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

  apache:
    container_name: crypto-wallet-apache
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      app:
        condition: service_started
    volumes:
      - storage_data:/var/www/html/storage

  mysql:
    container_name: crypto-wallet-mysql
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=256M
    environment:
      MYSQL_DATABASE: crypto_portfolio
      # If DB_USERNAME is root, we don't set MYSQL_USER because root already exists
      MYSQL_USER: "db_user"
      MYSQL_PASSWORD: "db_password"
      MYSQL_ROOT_PASSWORD: "root_password"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    container_name: crypto-wallet-redis
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  storage_data:
  bootstrap_cache:
